server:
  port: 8080

spring:
  application:
    name: DOSW-ParcialT2

  # ===== PostgreSQL (JPA) =====
  datasource:
    url: jdbc:postgresql://localhost:5432/dosw_parcial
    username: postgres
    password: ciclos234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


# ===== JWT =====
jwt:
  secret:  ZG9zdy1wYXJjaWFsLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1Ng==
  expiration: 86400000

# ===== SpringDoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ===== Logging / SLF4J =====
logging:
  level:
    root: INFO
    edu.dosw.parcial: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"