server:
  port: 8080

spring:
  application:
    name: DOSW-ParcialT2

  # ===== PostgreSQL (JPA) =====
  datasource:
    url: jdbc:postgresql://localhost:5432/dosw_parcial
    username: postgres
    password: ciclos234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== MongoDB =====
  data:
    mongodb:
      uri: mongodb://localhost:27017/dosw_parcial

# ===== JWT =====
jwt:
  secret: dosw-parcial-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000   # 24 horas en ms

# ===== SpringDoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ===== Logging / SLF4J =====
logging:
  level:
    root: INFO
    edu.dosw.parcial: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"